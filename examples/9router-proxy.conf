# Example systemd drop-in: route a 9Router gateway through the FreeHop proxy.
# Install as ~/.config/systemd/user/9router.service.d/freehop-proxy.conf,
# then: systemctl --user daemon-reload && systemctl --user restart 9router.service
# Assumes the FreeHop defaults (netns IP 10.200.0.2, proxy port 18080).
# If you changed NS_IP or PROXY_PORT in ~/.config/freehop/config, edit the
# addresses below to match.
[Service]
Environment=HTTPS_PROXY=http://10.200.0.2:18080
Environment=HTTP_PROXY=http://10.200.0.2:18080
Environment=NO_PROXY=127.0.0.1,localhost

[Unit]
After=freehop-proxy.service
Wants=freehop-proxy.service
